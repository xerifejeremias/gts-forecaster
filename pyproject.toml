[tool.poetry]
name = "gts-forecaster"
version = "0.1.0"
description = "General time series forecasting pipeline for many series (uuid, date, target, explanatory variables)."
authors = ["Pedro Leao"]
readme = "README.md"
packages = [{ include = "gts_forecaster", from = "src" }]

[tool.poetry.dependencies]
# Version ranges checked against the libraries' releases and source on 2026-10-05 (see OVERVIEW.md,
# "Library versions"). Python 3.12 or 3.13 is needed: the current releases of numpy, xgboost,
# scikit-learn, arviz and orbit-ml no longer support 3.10/3.11, and an older range would make
# poetry quietly install years-old versions.
python = ">=3.12,<3.14"
# pandas 3 is NOT allowed yet: statsforecast and mlforecast both require pandas < 3.
pandas = ">=2.2.3,<3"
numpy = ">=2.1,<3"
pandera = { version = ">=0.24,<1", extras = ["pandas"] }
pyyaml = ">=6.0"
# Input formats (io/loaders.py): Parquet files need pyarrow; SQL queries need SQLAlchemy plus the
# driver of your database (e.g. psycopg for PostgreSQL, pyodbc for SQL Server), installed separately.
pyarrow = ">=15"
sqlalchemy = { version = ">=2.0,<3", optional = true }
# Optional: public holidays by country for the business-day calendar features (features.yaml).
holidays = { version = ">=0.50,<1", optional = true }  # prophet needs holidays < 1
# Optional model families. Install what you need, for example: poetry install --extras "stats ml foundation"
statsforecast = { version = ">=2.1,<3", optional = true }  # 2.1 dropped numba (no compile wait, no Windows pin)
mlforecast = { version = ">=1.0,<2", optional = true }
lightgbm = { version = ">=4.0,<5", optional = true }
xgboost = { version = ">=2.0,<4", optional = true }
scikit-learn = { version = ">=1.5,<2", optional = true }
# 2.3 added the `freq` argument handling and transformers 5 / pandas 3 support; on Windows, PyPI
# only has CPU builds of torch, so no large CUDA download.
chronos-forecasting = { version = ">=2.3,<3", optional = true }
prophet = { version = ">=1.1.6,<2", optional = true }  # Windows wheel includes CmdStan: no compiler needed
# Orbit is built from source when installed: it downloads CmdStan and compiles C++ code, so Windows
# needs a C++ toolchain (MinGW / RTools). That is why it is not part of `all-models`.
orbit-ml = { version = ">=1.1.5.1,<1.2", optional = true }

[tool.poetry.extras]
holidays = ["holidays"]
stats = ["statsforecast"]
ml = ["mlforecast", "lightgbm", "xgboost", "scikit-learn"]
foundation = ["chronos-forecasting"]
prophet = ["prophet"]
orbit = ["orbit-ml"]
sql = ["sqlalchemy"]
# everything that installs without a compiler (Orbit is left out on purpose, see above)
all-models = ["statsforecast", "mlforecast", "lightgbm", "xgboost", "scikit-learn", "chronos-forecasting", "prophet"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.5"

[tool.poetry.scripts]
validate-input = "gts_forecaster.data_preparation:main"
backtest = "gts_forecaster.pipelines.backtest:main"
forecast = "gts_forecaster.pipelines.forecast:main"
train = "gts_forecaster.pipelines.train:main"
report = "gts_forecaster.pipelines.report:main"
run-pipeline = "gts_forecaster.pipelines.run:main"
benchmark = "gts_forecaster.benchmark:main"
scheduled-run = "gts_forecaster.ops.jobs:main"
schedule = "gts_forecaster.ops.schedule:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"
